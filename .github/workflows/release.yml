name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Desktop checks
        run: npm run test:desktop
      - run: npm run dist
      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt
          for f in *.exe *.zip; do sha256sum "$f" | cut -d" " -f1 > "$f.sha256"; done
          cat SHA256SUMS.txt
      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tlk-pdf-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.sha256
            release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.zip release/*.sha256 release/SHA256SUMS.txt \
            --title "TLK PDF $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
