name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Desktop checks
        run: npm run test:desktop
      - run: npm run dist
      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tlk-pdf-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/SHA256SUMS.txt \
            --title "TLK PDF $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
